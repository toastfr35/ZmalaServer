[tool.ruff]
target-version = "py311"
extend-exclude = ["build_tools/runtime", "build_tools/tmp", "build_tools/dist", "tests/adhoc/tmp", "tmp", "data"]

[tool.ruff.lint]
# Check correctness without imposing a new formatting style on existing Python.
select = ["E4", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Standalone test/probe entry points locate the source tree before importing it.
"tests/**/*.py" = ["E402"]
