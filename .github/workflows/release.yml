name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r build_tools/release/requirements.txt
      - run: make package
      - run: python build_tools/release/guides.py
      - name: Publish server assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python build_tools/release/component.py publish build_tools/dist/ZmalaServer-*.tar.gz* build_tools/dist/guides/ZmalaServer-*.pdf
