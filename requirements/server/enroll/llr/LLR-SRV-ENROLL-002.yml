text: |
  Authenticated setup downloads shall produce one-page A4 PDFs with black-on-white QR codes and four-module white borders. English instructions shall identify the corresponding terminal or app scan step and mark private access codes. Wi-Fi and Terminal account sheets shall each place one portrait A5 face on the right half of a landscape A4 page, leaving the left half blank for folding. They shall show the approved Zmala light logo, a short Wi-Fi or Terminal heading, the corresponding scan prompt and a private-code note. The single QR shall span the face width inside 10 mm print margins, including its quiet border. SSIDs, passwords, account labels and server URLs shall not appear as separate printed text on these sheets. Terminal account sheets shall contain exactly one private server setup QR. App sheets shall retain a portrait A4 layout and contain exactly two distinct QR codes: a stable ZmalaPhone APK download URL and the private account setup payload. They shall also provide a clickable APK download URL, concise on-phone installation and permission instructions, and explain scanning from another screen or paper. Numbered steps and high-contrast text shall remain understandable when printed in grayscale.
verification: |
  Generate terminal, Wi-Fi and app PDFs, inspect page size, QR count, payloads and geometry, verify the blank folding half, 10 mm margins, full-width QR, logo and absence of separately printed credentials, capture instruction text and verify payload decoding and the App APK link annotation and installation text.
