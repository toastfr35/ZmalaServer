text: |
  A device token shall identify its owning enrolled Terminal or App account and shall not grant administrator access. Device routes shall derive identity from that token, not from a requested account or serial number. App tokens shall not grant access to Terminal configuration, settings, status or maintenance routes.
verification: |
  Try another device identity and administrator endpoints with Terminal and App tokens. Check configuration, callbacks, status and command ownership, including denial of Terminal-only routes to App tokens.
