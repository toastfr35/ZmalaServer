text: |
  The English interface shall provide Overview, Accounts, Groups, Terminals, Callbacks and Activity pages. Recent events shall appear on Activity and ongoing calls on Overview.
  A keyboard-accessible moon and sun control at the bottom left shall switch between dark and light appearance. The selection shall persist across pages and reloads when local browser storage is available.
