verification: |
  Exercise both App ownership directions, Terminal read-only access, strangers and
  unconnected dialogs. Check byte/pixel/dimension bounds, normalized image metadata,
  global and per-dialog decoder contention and slot recovery after failure. With a
  controlled clock, inspect the exact lease, renew current versus stale revisions,
  expire at the deadline and verify old image revisions are inaccessible. Delay
  upload arrival and conversion across stop, call closure and either enrollment's
  replacement; assert obsolete uploads do not start conversion, no late publication
  or media negotiation occurs, and processing slots recover. Verify status fields,
  zero remaining lease during a pending replacement and capability flags.
