text: |
  Administration shall accept the exact shell values sh and bash, plus the retained
  legacy values powershell, pwsh and cmd. Values outside that enumeration shall be
  rejected before changing the profile. Queuing a command shall capture the selected
  shell; a subsequent profile edit shall not change the queued command. Accepting a
  stored shell value shall not imply that the target Terminal can execute it:
  execution compatibility shall remain the Terminal's responsibility.
verification: |
  Save each accepted shell and reject empty, null, non-string and unknown values
  without changing the profile or revision. Queue a command with sh, change the
  profile to bash, then claim the command and verify it still specifies sh. Check
  that legacy saved shell values remain representable without claiming Pi support
  for executing Windows shells.
