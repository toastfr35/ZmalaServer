text: |
  Forwarding to an enrolled Terminal or App shall replace any supplied X-Family-Auth caller proof with lowercase hexadecimal HMAC-SHA256 derived from that recipient's device token over the UTF-8 string CALL_ID:CALLER_ACCOUNT. The proof shall bind the caller and call identity. Forwarding shall remove the caller's Authorization and Proxy-Authorization headers.
verification: |
  Forward calls to Terminal and App recipients, recalculate proofs independently and verify recipient-key isolation, removal of caller authentication headers and replacement of supplied proofs.
